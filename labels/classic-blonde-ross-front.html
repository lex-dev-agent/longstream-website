<!doctype html>
<meta charset="utf-8">
<title>Classic Blonde Gin — front label (Ross)</title>
<!-- Ross's wording, typeface, case and colours on the same front label.
     Trim 130 x 115, plus 3mm bleed and a 6mm margin for the crop marks. -->
<link rel="stylesheet" href="classic-blonde-ross-front.css">
<style>@page { size: 148mm 133mm; margin: 0; }</style>
<style>.label { --trim-w: 130mm; }
.sheet { width: 148mm; height: 133mm; }</style>

<div class="sheet">
  <div class="mark tl"></div><div class="mark tr"></div>
  <div class="mark bl"></div><div class="mark br"></div>

  <div class="bleed">
    <div class="trim">
      <div class="label">
        <img class="art" src="../public/images/woman-background-copper-label.jpg" alt="">
        <div class="artfade"></div>
        <div class="keyline"></div>

        <div class="content">
          <p class="brandline">LONGSTREAM<img class="brandmark" src="../public/images/logo-white.png" alt="">DISTILLERY</p>

          <div class="portrait"></div>

          <div class="nameblock">
            <p class="variant">CLASSIC</p>
            <h1 class="brand">BLONDE</h1>
            <div class="gintype"><span>London Dry Gin</span></div>
          </div>

          <div class="footlines">
            <p class="origin">Mangaroa &ndash; Upper Hutt &ndash; New Zealand</p>
            <p class="tasting">Crisp Warm Spice with a Lime Finish</p>
            <p class="specs"><span>700 mL</span><span>38.0% Alc / Vol</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
