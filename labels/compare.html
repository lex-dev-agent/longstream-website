<!doctype html>
<meta charset="utf-8">
<title>Classic Blonde — front</title>
<!-- The same front twice: BLONDE set as type on the left, Ross's gold-embossed
     artwork on the right. Each fills half the window.

     These are RENDERED IMAGES (labels/proofs/*.webp), not the live label pages,
     and deliberately so. Ross's label is set in Times New Roman; a machine
     without it — any Linux box — silently falls back to another serif, so a
     live-rendered comparison shows the viewer's fonts rather than the label's.
     Rendering on the machine that has the fonts and shipping the picture means
     everyone sees the same thing. Re-run scripts/render-label.js after editing
     a label, then deploy.

     Add #live to the URL for the label pages themselves in iframes, showing the
     whole sheet with bleed and crop marks, and reaching the real elements with
     Inspect. That view IS subject to the font problem above. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14170f;
    --pad: 24px;
    /* Cap per label, so a very wide screen stops scaling them up. 760px is
       about 1.5x life size — 130mm is 491 CSS px, since CSS fixes 1in at
       96px whatever the display actually is. */
    --max-label: 760px;
  }

  /* Centred in the window both ways. `safe` so that when the labels are taller
     than the window they start at the top and scroll, rather than centring
     their overflow off-screen. */
  .grid {
    display: flex;
    align-items: safe center;
    min-height: 100vh;
    /* Cap the pair rather than each panel, so past the cap the two stay
       together with the same gaps instead of drifting apart. Three pads: the
       two outer margins and the one between. */
    max-width: calc(var(--max-label) * 2 + var(--pad) * 3);
    margin: 0 auto;
  }

  /* Half padding on the inside edges, so the two panels together leave a centre
     gap the same width as the margin around the outside. */
  .panel { width: 50%; padding: var(--pad); }
  .panel:first-child { padding-right: calc(var(--pad) / 2); }
  .panel:last-child  { padding-left:  calc(var(--pad) / 2); }

  .stage { width: 100%; overflow: hidden; }

  img { width: 100%; }

  /* The frame cannot reflow, so it is drawn at its real size and scaled to fit
     — see fit() below. It is also a few pixels larger than the 148 x 133mm
     sheet inside it: millimetres do not land on whole pixels, so a frame asked
     for 148mm gets a 147.9mm viewport, the sheet overflows it by a tenth of a
     millimetre, and scrollbars appear. The spare pixels absorb that. */
  iframe {
    width: calc(148mm + 6px); height: calc(133mm + 6px);
    border: 0; transform-origin: top left; background: #fff;
  }

  img, iframe { display: block; }
  /* An author-level display:block beats the UA sheet's [hidden] rule no matter
     the specificity, so the swap needs its own. */
  [hidden] { display: none; }
</style>

<div class="grid">
  <div class="panel"><div class="stage">
    <img src="proofs/classic-blonde-front-type.webp" alt="BLONDE as type">
    <iframe src="classic-blonde-front-type.html" title="BLONDE as type" hidden></iframe>
  </div></div>
  <div class="panel"><div class="stage">
    <img src="proofs/classic-blonde-front.webp" alt="BLONDE as artwork">
    <iframe src="classic-blonde-front.html" title="BLONDE as artwork" hidden></iframe>
  </div></div>
</div>

<script>
  const SHEET = { w: 148, h: 133 };    // mm, trim plus bleed and crop marks
  const mm = v => v * 96 / 25.4;

  function fit() {
    const live = location.hash === '#live';
    for (const stage of document.querySelectorAll('.stage')) {
      const frame = stage.querySelector('iframe');
      const img = stage.querySelector('img');
      frame.hidden = !live;
      img.hidden = live;

      if (live) {
        const z = stage.clientWidth / mm(SHEET.w);
        frame.style.transform = `scale(${z})`;
        stage.style.height = mm(SHEET.h) * z + 'px';
      } else {
        stage.style.height = 'auto';
      }
    }
  }
  addEventListener('hashchange', fit);
  addEventListener('resize', fit);
  fit();
</script>
